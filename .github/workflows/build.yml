name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: pwsh
        run: ./build.ps1
      - name: Deterministic tests
        shell: pwsh
        run: |
          foreach ($suite in @('domain','integrations','notifications','dictation','gaming','media')) {
            & "./tests/$suite.ps1"
            if ($LASTEXITCODE -ne 0) { throw "Failed: $suite" }
          }
      - name: Package
        shell: pwsh
        run: ./package.ps1 -SkipBuild
